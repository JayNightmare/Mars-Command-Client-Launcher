name: Build client installers

on:
    push:
        tags:
            - "client-v*"

permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      bundle: deb
                      extension: deb
                    - os: windows-latest
                      bundle: nsis
                      extension: exe
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable

            - name: Install Linux Tauri dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y \
                    build-essential \
                    curl \
                    file \
                    libayatana-appindicator3-dev \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    librsvg2-dev \
                    libxdo-dev \
                    wget

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - run: npm ci

            - name: Validate release version
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#client-v}"
                  [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  export VERSION
                  node --input-type=module -e '
                    import fs from "node:fs";
                    const version = process.env.VERSION;
                    const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
                    const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
                    const packageLockVersion = packageLock.version;
                    const packageLockRootVersion = packageLock.packages?.[""]?.version;
                    const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
                    const cargoManifest = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
                    const cargoLock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");
                    const cargoVersion = cargoManifest.match(/^version = "([^"]+)"$/m)?.[1];
                    const cargoLockVersion = cargoLock.match(/\[\[package\]\]\r?\nname = "mars-command-client"\r?\nversion = "([^"]+)"/)?.[1];
                    const surfaces = {
                      packageVersion,
                      packageLockVersion,
                      packageLockRootVersion,
                      tauriVersion,
                      cargoVersion,
                      cargoLockVersion,
                    };
                    const mismatches = Object.entries(surfaces).filter(([, value]) => value !== version);
                    if (mismatches.length) {
                      throw new Error(`Tag ${version} does not match release version surfaces: ${JSON.stringify(surfaces)}`);
                    }
                  '

            - name: Build Linux package
              if: runner.os == 'Linux'
              run: npm run tauri -- build --bundles deb

            - name: Build Windows installer
              if: runner.os == 'Windows'
              run: npm run tauri -- build --bundles nsis

            - name: Stage versioned Linux installer
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#client-v}"
                  mkdir -p release-assets
                  mapfile -t installers < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
                  [[ "${#installers[@]}" -eq 1 ]]
                  cp "${installers[0]}" "release-assets/setup-${VERSION}.deb"

            - name: Stage versioned Windows installer
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $version = $env:GITHUB_REF_NAME.Substring("client-v".Length)
                  $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
                  if ($null -eq $installer) { throw "Tauri did not produce an NSIS setup executable." }
                  New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
                  Copy-Item $installer.FullName "release-assets/setup-$version.exe"

            - uses: actions/upload-artifact@v4
              with:
                  name: client-installer-${{ matrix.extension }}
                  path: release-assets/setup-*
                  if-no-files-found: error
                  retention-days: 1

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  pattern: client-installer-*
                  merge-multiple: true

            - name: Publish versioned installers
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Mars Command ${{ github.ref_name }}
                  files: release-assets/setup-*
